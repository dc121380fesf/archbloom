[package]
name = "archcore-render"
version = "0.1.0"
edition = "2021"

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
archcore-ir = { path = "../ir" }
archcore-ops = { path = "../ops" }
serde_json = "1"
image = "0.25"
rayon = "1"
wgpu = { version = "22", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

[lints]
workspace = true
