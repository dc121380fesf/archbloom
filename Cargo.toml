[workspace]
resolver = "2"
members = ["crates/ir", "crates/ops", "crates/txn", "crates/verify", "crates/mesh", "crates/engine", "crates/mcp", "crates/io", "crates/render", "app/src-tauri"]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
