<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Archbloom</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #171a20; color: #dfe3ea;
    font: 13px/1.5 system-ui, "Segoe UI", sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }

  /* ---------- 菜单栏 ---------- */
  #menubar { position: fixed; top: 0; left: 0; right: 0; height: 34px; z-index: 40;
    display: flex; align-items: center; gap: 2px; padding: 0 10px;
    background: #1b1f27; border-bottom: 1px solid #2a3140; user-select: none; }
  #brand { font-weight: 700; letter-spacing: .3px; margin-right: 10px; color: #8ab4f8; }
  .menu { position: relative; }
  .menu > button { background: transparent; color: #dfe3ea; border: 0; padding: 6px 11px;
    border-radius: 6px; cursor: pointer; font: inherit; }
  .menu > button:hover, .menu.open > button { background: #2a3140; }
  .dropdown { display: none; position: absolute; top: 100%; left: 0; min-width: 218px;
    background: #232a36; border: 1px solid #37405275; border-radius: 8px; padding: 5px;
    box-shadow: 0 12px 28px #0009; margin-top: 3px; }
  .menu.open .dropdown { display: block; }
  .item { display: flex; align-items: center; justify-content: space-between; gap: 18px;
    padding: 7px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .item:hover { background: #33405a; }
  .item kbd { font: 11px ui-monospace, monospace; opacity: .55; }
  .sep { height: 1px; background: #374052; margin: 5px 6px; }
  .subparent { position: relative; }
  .subparent > .item::after { content: "▸"; opacity: .6; }
  .submenu { display: none; position: absolute; left: 100%; top: -6px; min-width: 230px;
    background: #232a36; border: 1px solid #37405275; border-radius: 8px; padding: 5px;
    box-shadow: 0 12px 28px #0009; }
  .subparent:hover > .submenu { display: block; }
  .group { padding: 6px 10px 3px; font-size: 11px; letter-spacing: .5px;
    color: #8ab4f8; opacity: .85; }

  /* ---------- 状态栏 ---------- */
  #status { position: fixed; top: 34px; left: 0; right: 0; height: 26px; z-index: 30;
    display: flex; align-items: center; gap: 12px; padding: 0 12px; font-size: 12px;
    background: #141820e6; border-bottom: 1px solid #2a3140; backdrop-filter: blur(6px); }
  #docname { font-weight: 600; }
  #docpath { opacity: .55; font: 11px ui-monospace, monospace; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  #scenestat { opacity: .75; }

  /* ---------- 出图面板 ---------- */
  #panel { position: fixed; top: 72px; right: 12px; width: 250px; z-index: 20;
    background: rgba(20,24,32,.9); border: 1px solid #2a3140; border-radius: 10px;
    padding: 12px 14px; backdrop-filter: blur(6px); display: grid; gap: 9px; }
  #panel h3 { margin: 0; font-size: 13px; }
  #panel label { display: grid; gap: 3px; font-size: 11px; opacity: .8; }
  #panel select { background: #0e1117; color: #dfe3ea; border: 1px solid #2c3442;
    border-radius: 6px; padding: 5px 7px; font: 12px system-ui; }
  button { background: #3b82f6; color: #fff; border: 0; border-radius: 6px;
    padding: 7px 14px; cursor: pointer; font-weight: 600; }
  button:hover { background: #2f6fe0; }
  button:disabled { background: #2c3442; cursor: wait; }
  #presult { font: 11px ui-monospace, monospace; opacity: .85; word-break: break-all; min-height: 30px; }
  #part { position: fixed; top: 72px; left: 12px; width: 250px; z-index: 20;
    background: rgba(20,24,32,.9); border: 1px solid #2a3140; border-radius: 10px;
    padding: 12px 14px; backdrop-filter: blur(6px); display: grid; gap: 9px; }
  #part h3 { margin: 0; font-size: 13px; }
  #part .sub { font-size: 10px; opacity: .5; margin-top: -5px; }
  #part label { display: grid; gap: 3px; font-size: 11px; opacity: .8; }
  #part input, #part select { background: #0e1117; color: #dfe3ea; border: 1px solid #2c3442;
    border-radius: 6px; padding: 5px 7px; font: 12px system-ui; width: 100%; }
  #part .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #part .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  #part button { padding: 6px 10px; font-size: 12px; }
  #part button.sec { background: #232a36; }
  #part button.sec:hover { background: #2c3543; }
  #pinfo { font: 11px ui-monospace, monospace; opacity: .85; line-height: 1.6;
    border-top: 1px solid #2a3140; padding-top: 8px; white-space: pre-wrap; }
  #pinfo b { color: #7dd3a0; font-weight: 600; }
  #pinfo .bad { color: #f08a8a; }
  #hint { position: fixed; bottom: 12px; left: 14px; opacity: .55; z-index: 10; }
</style>
</head>
<body>
<div id="menubar">
  <span id="brand">Archbloom</span>
  <div class="menu" id="filemenu">
    <button id="filebtn">文件</button>
    <div class="dropdown">
      <div class="item" data-cmd="new">新建 <kbd>Ctrl+N</kbd></div>
      <div class="item" data-cmd="open">打开… <kbd>Ctrl+O</kbd></div>
      <div class="subparent">
        <div class="item">最近打开</div>
        <div class="submenu" id="recentmenu"></div>
      </div>
      <div class="sep"></div>
      <div class="item" data-cmd="save">保存 <kbd>Ctrl+S</kbd></div>
      <div class="item" data-cmd="saveas">另存为… <kbd>Ctrl+Shift+S</kbd></div>
      <div class="sep"></div>
      <div class="subparent">
        <div class="item">导出</div>
        <div class="submenu">
          <div class="group">模型格式</div>
          <div class="item" data-export="gltf">glTF 2.0 (.gltf)</div>
          <div class="item" data-export="glb">binary glTF (.glb)</div>
          <div class="item" data-export="fbx">FBX (.fbx)</div>
          <div class="item" data-export="ifc">IFC4 (.ifc)</div>
          <div class="item" data-export="html">审阅页 (.html)</div>
          <div class="sep"></div>
          <div class="group">渲染图片</div>
          <div class="item" data-export="png">静帧 PNG</div>
          <div class="item" data-export="pano">全景 PNG</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="status">
  <span id="docname">未命名</span>
  <span id="scenestat">未载入</span>
  <span id="docpath"></span>
</div>

<div id="panel">
  <h3>出图</h3>
  <label>预设
    <select id="preset">
      <option value="view">透视渲染（路径追踪）</option>
      <option value="pano">全景（等距柱状 2:1）</option>
    </select>
  </label>
  <label>分辨率
    <select id="res">
      <option value="1280x720">1280 × 720</option>
      <option value="1920x1080" selected>1920 × 1080</option>
      <option value="2560x1440">2560 × 1440</option>
      <option value="3840x2160">3840 × 2160</option>
    </select>
  </label>
  <label>采样（spp）
    <select id="spp">
      <option value="16">16（快）</option>
      <option value="64" selected>64（标准）</option>
      <option value="128">128（细）</option>
    </select>
  </label>
  <label>渲染轨
    <select id="track">
      <option value="auto" selected>auto（GPU 优先）</option>
      <option value="gpu">gpu</option>
      <option value="cpu">cpu（确定性）</option>
    </select>
  </label>
  <button id="shot">出图</button>
  <div id="presult">就绪。产物落在文档旁。</div>
</div>

<div id="part">
  <h3>零件工作台</h3>
  <div class="sub">精确 B-rep · 可出 STEP</div>
  <div class="row">
    <label>类型
      <select id="pkind">
        <option value="box">盒子</option>
        <option value="cylinder">圆柱</option>
      </select>
    </label>
    <label>&nbsp;
      <button id="pnew">新建</button>
    </label>
  </div>
  <div id="pbox">
    <div class="row3">
      <label>长 mm<input id="pdx" type="number" value="20" step="1"></label>
      <label>宽 mm<input id="pdy" type="number" value="20" step="1"></label>
      <label>高 mm<input id="pdz" type="number" value="5" step="1"></label>
    </div>
  </div>
  <div id="pcyl" hidden>
    <div class="row">
      <label>直径 mm<input id="pdia" type="number" value="10" step="1"></label>
      <label>高 mm<input id="phgt" type="number" value="20" step="1"></label>
    </div>
  </div>
  <div class="row">
    <label>孔径 mm<input id="phole" type="number" value="10" step="1"></label>
    <label>&nbsp;<button id="pdrill" class="sec">打孔</button></label>
  </div>
  <div class="row">
    <button id="pmerge" class="sec">合并面片</button>
    <button id="pstep" class="sec">导出 STEP</button>
  </div>
  <div id="pinfo">尚未创建零件</div>
</div>

<div id="hint">拖动旋转 · 滚轮缩放 · 右键平移</div>
<canvas id="c"></canvas>

<script>
const invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: true });
const docNameEl = document.getElementById('docname');
const docPathEl = document.getElementById('docpath');
const sceneStatEl = document.getElementById('scenestat');
const resultEl = document.getElementById('presult');
window.onerror = (msg) => { sceneStatEl.textContent = `JS 异常: ${msg}`; return true; };
if (!gl) sceneStatEl.textContent = '需要 WebGL2（显卡驱动过旧？）';

// ---------- 菜单 ----------
const filemenu = document.getElementById('filemenu');
document.getElementById('filebtn').onclick = (e) => {
  e.stopPropagation();
  filemenu.classList.toggle('open');
};
document.addEventListener('click', () => filemenu.classList.remove('open'));
document.querySelector('.dropdown').addEventListener('click', e => e.stopPropagation());

// ---------- 着色器：纹理 × 材质底色 × 日光/天空环境 ----------
const vs = `#version 300 es
in vec3 aPos; in vec3 aNormal; in vec3 aColor; in vec2 aUV;
uniform mat4 uMVP; out vec3 vColor; out vec3 vNormal; out vec2 vUV;
void main(){ vColor = aColor; vNormal = aNormal; vUV = aUV;
  gl_Position = uMVP * vec4(aPos, 1.0); }`;
const fs = `#version 300 es
precision highp float;
in vec3 vColor; in vec3 vNormal; in vec2 vUV;
uniform sampler2D uTex; uniform float uTexOn;
out vec4 fragColor;
void main(){
  vec3 l = normalize(vec3(0.45, 0.32, 0.83));
  float d = 0.30 + 0.70 * abs(dot(normalize(vNormal), l));
  vec3 base = vColor * mix(vec3(1.0), texture(uTex, vUV).rgb, uTexOn);
  vec3 c = pow(base * d, vec3(1.0 / 2.2));
  fragColor = vec4(c, 1.0);
}`;
function shader(type, src){ const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s; }
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog); gl.useProgram(prog);
const loc = {
  pos: gl.getAttribLocation(prog, 'aPos'),
  normal: gl.getAttribLocation(prog, 'aNormal'),
  color: gl.getAttribLocation(prog, 'aColor'),
  uv: gl.getAttribLocation(prog, 'aUV'),
  mvp: gl.getUniformLocation(prog, 'uMVP'),
  texOn: gl.getUniformLocation(prog, 'uTexOn'),
};

// ---------- 矩阵 ----------
function perspective(fov, aspect, near, far){
  const f = 1 / Math.tan(fov / 2);
  return new Float32Array([f/aspect,0,0,0, 0,f,0,0, 0,0,(far+near)/(near-far),-1, 0,0,2*far*near/(near-far),0]);
}
function lookAt(eye, center, up){
  const z = norm(sub(eye, center)), x = norm(cross(up, z)), y = cross(z, x);
  return new Float32Array([
    x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
    -dot(x,eye), -dot(y,eye), -dot(z,eye), 1]);
}
function mul(a, b){ const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++){
    let s = 0; for (let k = 0; k < 4; k++) s += a[k*4+r] * b[c*4+k];
    o[c*4+r] = s; } return o; }
const sub = (a,b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const cross = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const dot = (a,b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const norm = v => { const l = Math.max(Math.hypot(...v), 1e-9); return [v[0]/l, v[1]/l, v[2]/l]; };

// ---------- 轨道相机 ----------
let yaw = 0.7, pitch = 0.5, dist = 26, target = [8, 6, 4];
let dragging = 0;
canvas.addEventListener('mousedown', e => dragging = e.button + 1);
window.addEventListener('mouseup', () => dragging = 0);
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  if (dragging === 1) { yaw += e.movementX * 0.008; pitch = Math.max(-1.5, Math.min(1.5, pitch + e.movementY * 0.008)); }
  else { const right = norm(cross([0,0,1], norm(sub(eyePos(), target))));
    const upv = cross(norm(sub(eyePos(), target)), right);
    const k = dist * 0.0016;
    target = [target[0] - right[0]*e.movementX*k + upv[0]*e.movementY*k,
              target[1] - right[1]*e.movementX*k + upv[1]*e.movementY*k,
              target[2] - right[2]*e.movementX*k + upv[2]*e.movementY*k]; }
  render();
});
canvas.addEventListener('wheel', e => { e.preventDefault();
  dist = Math.max(0.4, Math.min(400, dist * (e.deltaY > 0 ? 1.12 : 0.9))); render(); },
  { passive: false });
function eyePos(){
  return [target[0] + dist * Math.cos(pitch) * Math.cos(yaw),
          target[1] + dist * Math.cos(pitch) * Math.sin(yaw),
          target[2] + dist * Math.sin(pitch)];
}

// ---------- 几何：按贴图分批 ----------
const batches = [];
const texCache = new Map();
function loadTriangles(tris, texPaths){
  texCache.clear();
  const groups = new Map();
  for (const t of tris) {
    const key = (t.tex === null || t.tex === undefined) ? -1 : t.tex;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(t);
  }
  for (const b of batches) { gl.deleteBuffer(b.buf); gl.deleteVertexArray(b.vao); }
  batches.length = 0;
  for (const [key, list] of groups) {
    const data = [];
    for (const t of list) {
      const n = norm(cross(sub(t.p[1], t.p[0]), sub(t.p[2], t.p[0])));
      const uvs = t.uv || [[0,0],[0,0],[0,0]];
      for (let i = 0; i < 3; i++) {
        const p = t.p[i];
        data.push(p[0], p[1], p[2], n[0], n[1], n[2],
                  t.color[0], t.color[1], t.color[2], uvs[i][0], uvs[i][1]);
      }
    }
    const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
    const stride = 11 * 4;
    gl.enableVertexAttribArray(loc.pos); gl.vertexAttribPointer(loc.pos, 3, gl.FLOAT, false, stride, 0);
    gl.enableVertexAttribArray(loc.normal); gl.vertexAttribPointer(loc.normal, 3, gl.FLOAT, false, stride, 12);
    gl.enableVertexAttribArray(loc.color); gl.vertexAttribPointer(loc.color, 3, gl.FLOAT, false, stride, 24);
    gl.enableVertexAttribArray(loc.uv); gl.vertexAttribPointer(loc.uv, 2, gl.FLOAT, false, stride, 36);
    batches.push({ tex: key, vao, buf, count: list.length * 3 });
    if (key >= 0) texCache.set(key, 'loading');
  }
  // 异步补贴图（失败退底色，不炸视口）
  for (const [key, state] of texCache) {
    if (state !== 'loading') continue;
    const p = texPaths[key];
    if (!p) { texCache.set(key, 'none'); continue; }
    invoke('read_texture', { path: p }).then(url => {
      const img = new Image();
      img.onload = () => {
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
        gl.generateMipmap(gl.TEXTURE_2D);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        texCache.set(key, tex); render();
      };
      img.onerror = () => { texCache.set(key, 'none'); };
      img.src = url;
    }).catch(() => texCache.set(key, 'none'));
  }
}
function resize(){
  canvas.width = canvas.clientWidth * devicePixelRatio;
  canvas.height = canvas.clientHeight * devicePixelRatio;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
function render(){
  if (!gl) return;
  resize();
  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(0.09, 0.10, 0.13, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  if (!batches.length) return;
  const proj = perspective(0.9, canvas.width / canvas.height, 0.05, 2000);
  const view = lookAt(eyePos(), target, [0, 0, 1]);
  gl.uniformMatrix4fv(loc.mvp, false, mul(proj, view));
  for (const b of batches) {
    const tex = texCache.get(b.tex);
    const on = (typeof tex === 'object' && tex) ? 1 : 0;
    gl.uniform1f(loc.texOn, on);
    if (on) { gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex); }
    gl.bindVertexArray(b.vao);
    gl.drawArrays(gl.TRIANGLES, 0, b.count);
  }
}
window.addEventListener('resize', render);

// ---------- 文档状态 ----------
let docPath = null;
function applyDoc(r){
  if (!r) return;
  docPath = r.path || null;
  docNameEl.textContent = r.name || '未命名';
  docPathEl.textContent = docPath || '（尚未保存）';
  document.title = `${r.name || '未命名'} — Archbloom`;
}
async function refreshView(){
  if (!invoke) { sceneStatEl.textContent = 'Tauri 全局未注入'; return; }
  try {
    const res = await invoke('read_scene');
    loadTriangles(res.triangles, res.textures || []);
    // 首次载入时把相机对准场景包围盒中心
    if (res.triangles.length) {
      let lo = [1e9,1e9,1e9], hi = [-1e9,-1e9,-1e9];
      for (const t of res.triangles) for (const p of t.p)
        for (let i = 0; i < 3; i++) { lo[i] = Math.min(lo[i], p[i]); hi[i] = Math.max(hi[i], p[i]); }
      const size = Math.max(hi[0]-lo[0], hi[1]-lo[1], hi[2]-lo[2], 1);
      target = [(lo[0]+hi[0])/2, (lo[1]+hi[1])/2, (lo[2]+hi[2])/2];
      dist = size * 2.2;
    }
    render();
    sceneStatEl.textContent = `${res.triangles.length} 三角形 · ${(res.textures || []).length} 贴图`;
  } catch (e) {
    sceneStatEl.textContent = `失败: ${e}`;
  }
}

// ---------- 文件命令 ----------
function say(msg){ resultEl.textContent = msg; }
async function cmdNew(){
  try {
    const r = await invoke('new_doc');
    if (r && r.cancelled) { say('已取消新建'); return; }
    applyDoc(r); await refreshView(); say('已新建空白场景');
  } catch (e) { say(`新建失败: ${e}`); }
}

// ---------- 最近打开 ----------
async function renderRecent(){
  const el = document.getElementById('recentmenu');
  el.innerHTML = '<div class="group">最近文件</div>';
  let list = [];
  try { list = await invoke('recent_files'); } catch (e) { list = []; }
  if (!list.length) {
    const d = document.createElement('div');
    d.className = 'item';
    d.style.opacity = '.45';
    d.textContent = '（暂无）';
    el.appendChild(d);
    return;
  }
  for (const f of list) {
    const d = document.createElement('div');
    d.className = 'item';
    d.dataset.recent = f.path;
    d.title = f.path;
    d.textContent = f.name;
    el.appendChild(d);
  }
}
async function cmdOpenRecent(path){
  try {
    const r = await invoke('open_recent', { path });
    if (r && r.cancelled) { say('已取消'); return; }
    applyDoc(r); await refreshView(); await renderRecent(); say(`已打开 ${path}`);
  } catch (e) { say(`打开失败: ${e}`); }
}
async function cmdOpen(){
  try {
    const r = await invoke('open_doc');
    if (r && r.cancelled) { say('已取消'); return; }
    applyDoc(r); await refreshView(); await renderRecent(); say('已打开');
  } catch (e) { say(`打开失败: ${e}`); }
}
async function cmdSave(){
  try {
    const r = await invoke('save_doc');
    if (r && r.cancelled) { say('已取消'); return; }
    applyDoc(r);
    const w = (r.warnings && r.warnings.length) ? `（${r.warnings.join('；')}）` : '';
    say(`已保存${w}`);
  } catch (e) { say(`保存失败: ${e}`); }
}
async function cmdSaveAs(){
  try {
    const r = await invoke('save_doc_as');
    if (r && r.cancelled) { say('已取消'); return; }
    applyDoc(r);
    const w = (r.warnings && r.warnings.length) ? `（${r.warnings.join('；')}）` : '';
    say(`已保存到\n${r.path}${w}`);
  } catch (e) { say(`另存为失败: ${e}`); }
}
async function cmdExport(kind){
  try {
    const r = await invoke('export_scene', { kind });
    if (r && r.cancelled) { say('已取消'); return; }
    say(`已导出 ${kind}\n${r.path}`);
  } catch (e) { say(`导出失败: ${e}`); }
}
async function exportImage(preset){
  try {
    const [w, h] = document.getElementById('res').value.split('x').map(Number);
    const spp = Number(document.getElementById('spp').value);
    const track = document.getElementById('track').value;
    const pick = await invoke('pick_save_path', {
      defaultName: `render_${preset}_${w}x${h}.png`,
      filterLabel: 'PNG 图片', exts: ['png'],
    });
    if (pick.cancelled) { say('已取消'); return; }
    say(`渲染中…（${preset} ${w}×${h} ${spp}spp）`);
    const r = await invoke('render_scene', { preset, width: w, height: h, spp, renderer: track, outPath: pick.path });
    say(`完成 ${(r.elapsed_ms / 1000).toFixed(1)}s · ${r.track}\n${r.path}`);
  } catch (e) { say(`导出图片失败: ${e}`); }
}

// ---------- 菜单派发 + 快捷键 ----------
document.querySelector('.dropdown').addEventListener('click', (e) => {
  const item = e.target.closest('[data-cmd],[data-export],[data-recent]');
  if (!item) return;
  filemenu.classList.remove('open');
  if (item.dataset.recent) { cmdOpenRecent(item.dataset.recent); return; }
  if (item.dataset.cmd) {
    ({ new: cmdNew, open: cmdOpen, save: cmdSave, saveas: cmdSaveAs })[item.dataset.cmd]?.();
  } else if (item.dataset.export) {
    const k = item.dataset.export;
    if (k === 'png') exportImage('view');
    else if (k === 'pano') exportImage('pano');
    else cmdExport(k);
  }
});
// 展开菜单时刷新最近列表
document.getElementById('filebtn').addEventListener('click', () => { if (filemenu.classList.contains('open')) renderRecent(); });
window.addEventListener('keydown', (e) => {
  if (!(e.ctrlKey || e.metaKey)) return;
  const k = e.key.toLowerCase();
  if (k === 's') { e.preventDefault(); e.shiftKey ? cmdSaveAs() : cmdSave(); }
  else if (k === 'o') { e.preventDefault(); cmdOpen(); }
  else if (k === 'n') { e.preventDefault(); cmdNew(); }
  else if (k === 'e') { e.preventDefault(); filemenu.classList.add('open'); }
});

// ---------- 出图面板 ----------
document.getElementById('shot').onclick = async () => {
  if (!invoke) { say('Tauri 全局未注入'); return; }
  const btn = document.getElementById('shot');
  const [w, h] = document.getElementById('res').value.split('x').map(Number);
  const args = {
    preset: document.getElementById('preset').value,
    width: w, height: h,
    spp: Number(document.getElementById('spp').value),
    renderer: document.getElementById('track').value,
    outPath: null,
  };
  btn.disabled = true;
  say(`渲染中…（${args.preset} ${w}×${h} ${args.spp}spp）`);
  try {
    const r = await invoke('render_scene', args);
    say(`完成 ${(r.elapsed_ms / 1000).toFixed(1)}s · ${r.track}\n${r.path}`);
  } catch (e) {
    say(`失败: ${e}`);
  } finally {
    btn.disabled = false;
  }
};

// ---------- 启动 ----------
(async () => {
  try { applyDoc(await invoke('doc_info')); } catch (e) { /* 忽略 */ }
  await renderRecent();
  refreshView();
  render();
})();

// ─── 零件工作台 ───
// 与建筑场景平行：左边这栏走 B-rep 内核，输出的是精确几何与 STEP。
(function partWorkbench() {
  const $ = (id) => document.getElementById(id);
  const info = $('pinfo');
  let busy = false;

  const kindSel = $('pkind');
  kindSel.onchange = () => {
    const isBox = kindSel.value === 'box';
    $('pbox').hidden = !isBox;
    $('pcyl').hidden = isBox;
  };

  function showInfo(d) {
    if (!d) { info.textContent = '尚未创建零件'; return }
    const wt = d.watertight
      ? '<b>水密 ✓</b>'
      : `<span class="bad">不水密（边界边 ${d.boundaryHalfEdges}）</span>`;
    info.innerHTML =
      `<b>${d.label}</b>  ·  ${d.step}\n` +
      `面 ${d.faces}   边 ${d.edges}   顶点 ${d.verts}\n` +
      `体积 ${d.volumeMm3.toFixed(3)} mm³\n` +
      `尺寸 ${d.sizeMm.map((v) => v.toFixed(1)).join(' × ')} mm\n` +
      `欧拉 ${d.euler}   ${wt}\n` +
      `带洞面 ${d.holedFaces}   曲面 ${d.curvedFaces}`;
  }

  async function run(fn, label) {
    if (!invoke) { info.textContent = 'Tauri 全局未注入'; return }
    if (busy) return;
    busy = true;
    info.textContent = label + '…';
    try {
      const d = await fn();
      showInfo(d);
    } catch (e) {
      info.innerHTML = `<span class="bad">${String(e)}</span>`;
    } finally {
      busy = false;
    }
  }

  $('pnew').onclick = () => {
    const kind = kindSel.value;
    const params = kind === 'box'
      ? [$('pdx').value, $('pdy').value, $('pdz').value].map(Number)
      : [$('pdia').value, $('phgt').value].map(Number);
    if (params.some((v) => !(v > 0))) { info.textContent = '尺寸要大于 0'; return }
    run(() => invoke('part_new', { kind, params }), '新建');
  };

  $('pdrill').onclick = () => {
    const diameter = Number($('phole').value);
    if (!(diameter > 0)) { info.textContent = '孔径要大于 0'; return }
    run(() => invoke('part_drill', { diameter, depth: 1000 }), '打孔');
  };

  $('pmerge').onclick = () => run(() => invoke('part_merge'), '合并面片');

  $('pstep').onclick = async () => {
    if (!invoke) return;
    try {
      const r = await invoke('part_export_step', { name: '' });
      if (r.cancelled) return;
      info.innerHTML += `\n导出 ${r.path}\n${r.bytes} 字节`;
    } catch (e) {
      info.innerHTML = `<span class="bad">${String(e)}</span>`;
    }
  };
})();
</script>
