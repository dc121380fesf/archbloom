<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Archcore 评审视口</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #171a20; color: #dfe3ea;
    font: 13px/1.5 system-ui, "Segoe UI", sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; top: 12px; left: 14px; right: 14px; display: flex; gap: 10px;
    align-items: center; background: rgba(20,24,32,.82); padding: 9px 12px;
    border-radius: 10px; backdrop-filter: blur(6px); }
  #path { flex: 1; background: #0e1117; color: #dfe3ea; border: 1px solid #2c3442;
    border-radius: 6px; padding: 6px 9px; font: 12px ui-monospace, monospace; }
  button { background: #3b82f6; color: #fff; border: 0; border-radius: 6px;
    padding: 7px 14px; cursor: pointer; font-weight: 600; }
  button:hover { background: #2f6fe0; }
  #status { opacity: .85; min-width: 170px; }
  #hint { position: fixed; bottom: 12px; left: 14px; opacity: .6; }
</style>
</head>
<body>
<div id="hud">
  <strong>Archcore 评审视口</strong>
  <input id="path" value="D:/Word/arch0-spike/review_scene.json" spellcheck="false">
  <button id="load">重新载入场景</button>
  <span id="status">未载入</span>
</div>
<div id="hint">拖动旋转 · 滚轮缩放 · 右键平移</div>
<canvas id="c"></canvas>
<script>
const invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: true });
const statusEl = document.getElementById('status');
window.onerror = (msg) => { statusEl.textContent = `JS 异常: ${msg}`; return true; };

// ---------- 着色器（平涂 + 法线明暗） ----------
const vs = `attribute vec3 aPos; attribute vec3 aNormal; attribute vec3 aColor;
uniform mat4 uMVP; varying vec3 vColor; varying vec3 vNormal;
void main(){ vColor = aColor; vNormal = aNormal;
  gl_Position = uMVP * vec4(aPos, 1.0); }`;
const fs = `precision mediump float; varying vec3 vColor; varying vec3 vNormal;
void main(){ vec3 l = normalize(vec3(0.4, 0.35, 0.85));
  float d = 0.32 + 0.68 * abs(dot(normalize(vNormal), l));
  gl_FragColor = vec4(vColor * d, 1.0); }`;
function shader(type, src){ const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s; }
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog); gl.useProgram(prog);
const loc = {
  pos: gl.getAttribLocation(prog, 'aPos'),
  normal: gl.getAttribLocation(prog, 'aNormal'),
  color: gl.getAttribLocation(prog, 'aColor'),
  mvp: gl.getUniformLocation(prog, 'uMVP'),
};

// ---------- 矩阵 ----------
function perspective(fov, aspect, near, far){
  const f = 1 / Math.tan(fov / 2);
  return new Float32Array([f/aspect,0,0,0, 0,f,0,0, 0,0,(far+near)/(near-far),-1, 0,0,2*far*near/(near-far),0]);
}
function lookAt(eye, center, up){
  const z = norm(sub(eye, center)), x = norm(cross(up, z)), y = cross(z, x);
  return new Float32Array([
    x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
    -dot(x,eye), -dot(y,eye), -dot(z,eye), 1]);
}
function mul(a, b){ const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++){
    let s = 0; for (let k = 0; k < 4; k++) s += a[k*4+r] * b[c*4+k];
    o[c*4+r] = s; } return o; }
const sub = (a,b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const cross = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const dot = (a,b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const norm = v => { const l = Math.max(Math.hypot(...v), 1e-9); return [v[0]/l, v[1]/l, v[2]/l]; };

// ---------- 轨道相机 ----------
let yaw = 0.7, pitch = 0.5, dist = 6, target = [0, 0, 0.5];
let dragging = 0;
canvas.addEventListener('mousedown', e => dragging = e.button + 1);
window.addEventListener('mouseup', () => dragging = 0);
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  if (dragging === 1) { yaw += e.movementX * 0.008; pitch = Math.max(-1.5, Math.min(1.5, pitch + e.movementY * 0.008)); }
  else { const right = norm(cross([0,0,1], norm(sub(eyePos(), target))));
    const upv = cross(norm(sub(eyePos(), target)), right);
    const k = dist * 0.0016;
    target = [target[0] - right[0]*e.movementX*k + upv[0]*e.movementY*k,
              target[1] - right[1]*e.movementX*k + upv[1]*e.movementY*k,
              target[2] - right[2]*e.movementX*k + upv[2]*e.movementY*k]; }
  render();
});
canvas.addEventListener('wheel', e => { e.preventDefault();
  dist = Math.max(0.4, Math.min(200, dist * (e.deltaY > 0 ? 1.12 : 0.9))); render(); },
  { passive: false });
function eyePos(){
  return [target[0] + dist * Math.cos(pitch) * Math.cos(yaw),
          target[1] + dist * Math.cos(pitch) * Math.sin(yaw),
          target[2] + dist * Math.sin(pitch)];
}

// ---------- 几何缓冲 ----------
let vertexCount = 0;
const buf = gl.createBuffer();
function loadTriangles(tris){
  const data = [];
  for (const t of tris) {
    const n = norm(cross(sub(t.p[1], t.p[0]), sub(t.p[2], t.p[0])));
    for (const p of t.p) data.push(p[0], p[1], p[2], n[0], n[1], n[2], t.color[0], t.color[1], t.color[2]);
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
  const stride = 9 * 4;
  gl.enableVertexAttribArray(loc.pos); gl.vertexAttribPointer(loc.pos, 3, gl.FLOAT, false, stride, 0);
  gl.enableVertexAttribArray(loc.normal); gl.vertexAttribPointer(loc.normal, 3, gl.FLOAT, false, stride, 12);
  gl.enableVertexAttribArray(loc.color); gl.vertexAttribPointer(loc.color, 3, gl.FLOAT, false, stride, 24);
  vertexCount = tris.length * 3;
}
function resize(){
  canvas.width = canvas.clientWidth * devicePixelRatio;
  canvas.height = canvas.clientHeight * devicePixelRatio;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
function render(){
  resize();
  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(0.09, 0.10, 0.13, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  if (!vertexCount) return;
  const proj = perspective(0.9, canvas.width / canvas.height, 0.05, 500);
  const view = lookAt(eyePos(), target, [0, 0, 1]);
  gl.uniformMatrix4fv(loc.mvp, false, mul(proj, view));
  gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
}
window.addEventListener('resize', render);

async function loadScene(){
  const path = document.getElementById('path').value;
  if (!invoke) { statusEl.textContent = 'Tauri 全局未注入（在浏览器里打开会这样；桌面窗内不应出现）'; return; }
  statusEl.textContent = '载入中…';
  try {
    const res = await invoke('read_scene', { path });
    loadTriangles(res.triangles);
    render();
    statusEl.textContent = `${res.name || '场景'} · ${res.triangles.length} 三角形`;
  } catch (e) {
    statusEl.textContent = `失败: ${e}`;
  }
}
document.getElementById('load').onclick = loadScene;
loadScene();
render();
</script>
</body>
</html>
